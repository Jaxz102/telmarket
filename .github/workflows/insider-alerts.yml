name: Insider purchase alerts

on:
  # Triggered by Google Cloud Scheduler via the workflow_dispatch REST API at
  # 7AM, 11AM, 1PM, 3PM America/New_York, weekdays only. GitHub's own cron
  # trigger was dropped: it ran hours late and skipped runs entirely.
  workflow_dispatch:         # also allows manual runs from the Actions tab

concurrency:
  group: insider-alerts
  cancel-in-progress: false

permissions:
  contents: write            # needed to commit seen.json back

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and post
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Longest gap between runs is Fri 3PM -> Mon 7AM (64h); seen.json dedupes the overlap.
          LOOKBACK_HOURS: "66"
        run: python bot.py --once

      - name: Trigger Synra poll
        if: always()
        continue-on-error: true  # a Synra failure must not block persisting seen.json
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://synra-three.vercel.app/api/cron/poll

      - name: Persist seen.json
        run: |
          git config user.name "Jaxz102"
          git config user.email "42484410+Jaxz102@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && echo "no state change" && exit 0
          git commit -m "chore: update seen.json [skip ci]"
          git push
