name: Insider purchase alerts

on:
  schedule:
    # Target: 7AM, 11AM, 1PM, 3PM US/Eastern, weekdays only.
    # Cron is UTC-only, so this fires at the union of the EDT (UTC-4) and
    # EST (UTC-5) equivalents; the gate job below drops the wrong-offset runs.
    - cron: "0 11,12,15,16,17,18,19,20 * * 1-5"
  workflow_dispatch:         # allow manual runs from the Actions tab

concurrency:
  group: insider-alerts
  cancel-in-progress: false

permissions:
  contents: write            # needed to commit seen.json back

jobs:
  gate:
    # Scheduled runs only proceed at 07/11/13/15 US/Eastern on a weekday.
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          hour=$(TZ=America/New_York date +%-H)
          dow=$(TZ=America/New_York date +%u)
          case "$hour" in
            7|11|13|15) [ "$dow" -le 5 ] && echo "proceed=true" >> "$GITHUB_OUTPUT" || echo "proceed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "proceed=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "US/Eastern hour=$hour dow=$dow"

  run:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and post
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Trigger Synra poll
        if: always()
        continue-on-error: true  # a Synra failure must not block persisting seen.json
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://synra-three.vercel.app/api/cron/poll

      - name: Persist seen.json
        run: |
          git config user.name "Jaxz102"
          git config user.email "42484410+Jaxz102@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && echo "no state change" && exit 0
          git commit -m "chore: update seen.json [skip ci]"
          git push
