name: Insider purchase alerts

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC); GitHub may delay by a few minutes
  workflow_dispatch:         # allow manual runs from the Actions tab

concurrency:
  group: insider-alerts
  cancel-in-progress: false

permissions:
  contents: write            # needed to commit seen.json back

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape and post
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --once

      - name: Persist seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && echo "no state change" && exit 0
          git commit -m "chore: update seen.json [skip ci]"
          git push
